name: Link check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'docusaurus.config.js'
      - 'static/**'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build

      - name: Run htmltest
        uses: wjdp/htmltest-action@master
        with:
          config: utils/htmltest/.htmltest.yml
          path: build

      - name: Check llms.txt links resolve in the build
        run: |
          fail=0
          while read -r url; do
            [ -f "build${url%/}/index.html" ] || { echo "::error file=static/llms.txt::dead link: $url"; fail=1; }
          done < <(grep -oE 'https://docs\.upbound\.io[^)]*' static/llms.txt |
                   sed 's|https://docs.upbound.io||' | sort -u)
          exit $fail
