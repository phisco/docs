extends: existence
message: "Avoid using acronyms in a title or heading."
link: https://docs.microsoft.com/en-us/style-guide/acronyms#be-careful-with-acronyms-in-titles-and-headings
level: warning
scope: heading
tokens:
  - '[A-Z]{2,4}'
exceptions:
  - AKS
  - API
  - ARN
  - AWS
  - CD
  - CLI
  - CSS
  - CPU
  - DNS
  - EKS
  - GCP
  - GKE
  - LLM
  - IAM
  - MCP
  - MXP
  - MVP
  - OIDC
  - SCSS
  - UXP
  - VPC
  - XRD
  - ALB
  - SSH
  - RBAC
  - CA
  - AI
  - UI
  - URL
  - URI
  - ID
  - IRSA
  - SSO
