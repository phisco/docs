---
# Error: Upbound.AmericanEnglish
#
# Checks that US spelling is used instead of British spelling.
#
# This complements gitlab.British, which is already enabled but misses words
# that turn up in our docs. Vale's substitution rules match whole words, so
# an inflected form needs its own entry: gitlab.British catches "behaviour"
# but not "behaviours", and "analyse" but not "analysed".
#
# Add to this list rather than gitlab/British.yml, which is vendored and gets
# overwritten when the style is updated.
extends: substitution
message: 'Use the US spelling "%s" instead of the British "%s".'
level: error
ignorecase: true
swap:
  # Catalog: our own domain vocabulary, absent from gitlab.British.
  catalogue: catalog
  catalogues: catalogs
  catalogued: cataloged
  cataloguing: cataloging

  # Artifact: OCI vocabulary, so it appears often in registry docs.
  artefact: artifact
  artefacts: artifacts

  # Inflections of words gitlab.British lists in only one form.
  # "analyses" is deliberately absent: it's the standard US plural of
  # "analysis" as well as the British verb form, so flagging it misfires.
  analysed: analyzed
  analyser: analyzer
  analysers: analyzers
  analysing: analyzing
  behaviours: behaviors
  categorisation: categorization
  centres: centers
  colours: colors
  defences: defenses
  enquiries: inquiries
  favourites: favorites
  fibres: fibers
  flavours: flavors
  licences: licenses
  metres: meters
  modelled: modeled
  neighbours: neighbors
  normalisation: normalization
  normalised: normalized
  normalises: normalizes
  normalising: normalizing
  offences: offenses
  organisation: organization
  organisational: organizational
  organisations: organizations
  organised: organized
  organises: organizes
  organising: organizing
  programmes: programs
  realisation: realization
  realised: realized
  realises: realizes
  realising: realizing
  recognised: recognized
  recognises: recognizes
  recognising: recognizing
  standardisation: standardization
  standardises: standardizes
  standardising: standardizing
  theatres: theaters

  # Technical -ise/-isation words gitlab.British doesn't cover. The -ises form
  # matters as much as the rest: our docs are written in the third person
  # ("Hub synchronises the mirror").
  containerisation: containerization
  containerise: containerize
  containerised: containerized
  containerises: containerizes
  customisation: customization
  customisations: customizations
  customise: customize
  customised: customized
  customises: customizes
  customising: customizing
  deserialise: deserialize
  deserialised: deserialized
  deserialises: deserializes
  emphasise: emphasize
  emphasised: emphasized
  emphasises: emphasizes
  finalise: finalize
  finalised: finalized
  finalises: finalizes
  generalise: generalize
  generalised: generalized
  generalises: generalizes
  initialisation: initialization
  initialise: initialize
  initialised: initialized
  initialises: initializes
  initialising: initializing
  itemise: itemize
  itemised: itemized
  itemises: itemizes
  maximise: maximize
  maximised: maximized
  maximises: maximizes
  maximising: maximizing
  minimise: minimize
  minimised: minimized
  minimises: minimizes
  minimising: minimizing
  optimisation: optimization
  optimisations: optimizations
  optimise: optimize
  optimised: optimized
  optimises: optimizes
  optimising: optimizing
  parameterise: parameterize
  parameterised: parameterized
  parameterises: parameterizes
  prioritisation: prioritization
  prioritise: prioritize
  prioritised: prioritized
  prioritises: prioritizes
  prioritising: prioritizing
  randomise: randomize
  randomised: randomized
  randomises: randomizes
  sanitisation: sanitization
  sanitise: sanitize
  sanitised: sanitized
  sanitises: sanitizes
  sanitising: sanitizing
  serialisation: serialization
  serialise: serialize
  serialised: serialized
  serialises: serializes
  serialising: serializing
  specialisation: specialization
  specialise: specialize
  specialised: specialized
  specialises: specializes
  stabilise: stabilize
  stabilised: stabilized
  stabilises: stabilizes
  summarise: summarize
  summarised: summarized
  summarises: summarizes
  summarising: summarizing
  synchronisation: synchronization
  synchronise: synchronize
  synchronised: synchronized
  synchronises: synchronizes
  synchronising: synchronizing
  tokenisation: tokenization
  tokenise: tokenize
  tokenised: tokenized
  tokenises: tokenizes
  utilisation: utilization
  utilise: utilize
  utilised: utilized
  utilises: utilizes
  utilising: utilizing
  virtualisation: virtualization
  virtualise: virtualize
  virtualised: virtualized
  virtualises: virtualizes
  visualisation: visualization
  visualisations: visualizations
  visualise: visualize
  visualised: visualized
  visualises: visualizes

  # Other British forms that read as typos in US English.
  amongst: among
  judgement: judgment
  judgements: judgments
  learnt: learned
  practise: practice
  practised: practiced
  practises: practices
  practising: practicing
  whilst: while
